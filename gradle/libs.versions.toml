[versions]
androidGradlePlugin = "9.0.1"
androidxCarApp = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
junit = "4.13.2"
kotlin = "2.3.20"
desugarJdkLibs = "2.1.5"
newpipeExtractor = "v0.26.5"
aautoSdk = "v4.5"
appcompat = "1.7.1"
webkit = "1.17.1"
fragment = "1.8.9"
recyclerview = "1.4.0"
cardview = "1.0.0"
constraintlayout = "2.2.1"
media = "1.7.0"
exoplayer = "2.19.1"
okhttp = "4.12.0"
androidxCore = "1.18.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugarJdkLibs" }
newpipe-extractor = { module = "com.github.teamnewpipe:NewPipeExtractor", version.ref = "newpipeExtractor" }
aauto-sdk = { module = "com.github.martoreto:aauto-sdk", version.ref = "aautoSdk" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }
exoplayer = { module = "com.google.android.exoplayer:exoplayer", version.ref = "exoplayer" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "androidxCarApp" }
androidx-car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "androidxCarApp" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }